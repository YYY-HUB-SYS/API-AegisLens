name: tests

# 门禁：master 每次 push、每个 PR 都跑全量测试。
# 与仓库 AGENTS.md 的硬门禁一致 —— 交付前必须 `cd app && node --test test/*.test.js` 全绿。
# 矩阵覆盖两个存储后端：Node 22/24 走 SQLite（node:sqlite），Node 18–21 走 JSON 回退。
# 想把 JSON 回退路径也纳入覆盖，在矩阵里加 '20'（加之前先本地跑一遍确认那条也绿）。

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 诊断与失败摘要都用 ::error:: 打出去 —— 它会变成 check annotation，
      # 而 check-runs 的 annotations API **匿名可读**；日志接口要 admin 权限，
      # 出了红只能看着 job 页面干瞪眼。
      # 诊断特意放在跑测试**之前**：万一测试把整个 shell 打死，这些证据已经留下��。
      - name: 跑全量测试
        working-directory: app
        run: |
          set +e
          echo "::group::运行前诊断"
          echo "node: $(node --version)"
          echo "平台: $(uname -a)"
          echo "核数: $(nproc)"
          free -m
          df -h . | tail -2
          echo "glob 展开到的测试文件数: $(ls test/*.test.js 2>/dev/null | wc -l)"
          echo "::endgroup::"
          echo "::notice::node --test 开始，输出见本步日志"
          node --test test/*.test.js > "$RUNNER_TEMP/test-output.txt" 2>&1
          status=$?
          echo "::group::测试输出"
          cat "$RUNNER_TEMP/test-output.txt"
          echo "::endgroup::"
          if [ "$status" -ne 0 ]; then
            echo "::error::node --test 退出码 $status"
            grep -E 'not ok|✖|Error|error:|AssertionError|ERR_' "$RUNNER_TEMP/test-output.txt" \
              | head -60 | sed 's/^/::error::/'
            echo "::error::完整输出（前 120 行）"
            head -120 "$RUNNER_TEMP/test-output.txt" | sed 's/^/::error::/'
          fi
          exit $status
