name: tests

# 门禁：master 每次 push、每个 PR 都跑全量测试。
# 与仓库 AGENTS.md 的硬门禁一致 —— 交付前必须 `cd app && node --test test/*.test.js` 全绿。
# 矩阵覆盖两个存储后端：Node 22/24 走 SQLite（node:sqlite），Node 18–21 走 JSON 回退。
# 想把 JSON 回退路径也纳入覆盖，在矩阵里加 '20'（加之前先本地跑一遍确认那条也绿）。

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 装 Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 跑测试之前先把运行环境的诊断写进 step summary。
      # step summary 是公开可读的（不用 admin 权限），日志接口要 admin。
      # 这一段故意放在测试之前：万一测试把整个 shell 打死，
      # 至少 runner 的 CPU/内存/磁盘与 glob 展开结果已经留在页面上了。
      - name: 跑全量测试
        working-directory: app
        run: |
          set +e
          {
            echo '### 运行前诊断'
            echo '```'
            echo "node: $(node --version)"
            echo "平台: $(uname -a)"
            echo "CPU 核数: $(nproc)"
            echo "内存:"; free -m
            echo "磁盘:"; df -h . | tail -2
            echo "glob 展开到的测试文件数: $(ls test/*.test.js 2>/dev/null | wc -l)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          node --test test/*.test.js 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
          status=${PIPESTATUS[0]}
          {
            echo '### 全量测试输出'
            echo '```'
            cat "$RUNNER_TEMP/test-output.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
